
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Gradle wrapper
        id: wrapper
        shell: bash
        run: |
          echo "Repository root:"
          pwd
          echo "Files and directories:"
          ls -la
          echo "Searching for gradlew..."
          find . -type f -name gradlew -print

          if [ -f "./android_client/gradlew" ]; then
            echo "working_dir=android_client" >> "$GITHUB_OUTPUT"
          elif [ -f "./gradlew" ]; then
            echo "working_dir=." >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: gradlew was not found."
            echo "Check that the Gradle wrapper is committed to GitHub."
            exit 1
          fi

      - name: Make Gradle wrapper executable
        working-directory: ${{ steps.wrapper.outputs.working_dir }}
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ steps.wrapper.outputs.working_dir }}
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Android-Debug-APK
          path: ${{ steps.wrapper.outputs.working_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
